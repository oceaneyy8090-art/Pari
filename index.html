
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERMAID UNDER THE STARS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  overflow:hidden;
  background:#020b18;
  font-family:Georgia,serif;
  color:#d8f4ff;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.title{
  position:fixed;
  top:7%;
  width:100%;
  text-align:center;
  letter-spacing:5px;
  font-size:clamp(15px,3vw,25px);
  color:#c9eaff;
  text-shadow:0 0 20px #63cfff;
  pointer-events:none;
}

.subtitle{
  position:fixed;
  bottom:7%;
  width:100%;
  text-align:center;
  font-size:13px;
  letter-spacing:3px;
  color:#8abbd4;
  opacity:.8;
  pointer-events:none;
}

#music{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:190px;
  font-size:11px;
  color:#d8f4ff;
  opacity:.7;
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="title">MERMAID UNDER THE STARS</div>
<div class="subtitle">A DREAM BENEATH THE OCEAN</div>

<input id="music" type="file" accept="audio/*">

<script>
const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");

let W,H,DPR;
let particles=[];
let stars=[];
let time=0;
let audio=null;

const COUNT=1500;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);

  createStars();
  createMermaid();
}

function createStars(){
  stars=[];

  for(let i=0;i<130;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H*.72,
      r:Math.random()*1.7+.3,
      phase:Math.random()*6.28
    });
  }
}

/* ---------- GEOMETRY ---------- */

function insidePolygon(x,y,poly){
  let inside=false;

  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1];
    const xj=poly[j][0], yj=poly[j][1];

    const intersect=((yi>y)!==(yj>y)) &&
      (x<(xj-xi)*(y-yi)/(yj-yi)+xi);

    if(intersect)inside=!inside;
  }

  return inside;
}

function addPolygon(poly,count){
  const xs=poly.map(p=>p[0]);
  const ys=poly.map(p=>p[1]);

  const minX=Math.min(...xs);
  const maxX=Math.max(...xs);
  const minY=Math.min(...ys);
  const maxY=Math.max(...ys);

  let added=0;
  let attempts=0;

  while(added<count && attempts<count*30){
    attempts++;

    const x=minX+Math.random()*(maxX-minX);
    const y=minY+Math.random()*(maxY-minY);

    if(insidePolygon(x,y,poly)){
      addTarget(x,y);
      added++;
    }
  }
}

function addEllipse(cx,cy,rx,ry,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.sqrt(Math.random());

    addTarget(
      cx+Math.cos(a)*rx*r,
      cy+Math.sin(a)*ry*r
    );
  }
}

function addTarget(x,y,type="normal"){
  particles.push({
    x:Math.random()*W,
    y:Math.random()*H,
    tx:x,
    ty:y,
    size:Math.random()*1.7+.5,
    phase:Math.random()*6.28,
    speed:.025+Math.random()*.035,
    type
  });
}

function addCurve(points,count,type="hair"){
  for(let i=0;i<count;i++){
    const t=i/count;
    const p=bezier(points,t);
    addTarget(p.x,p.y,type);
  }
}

function bezier(p,t){
  const mt=1-t;

  return {
    x:mt*mt*mt*p[0][0]+
      3*mt*mt*t*p[1][0]+
      3*mt*t*t*p[2][0]+
      t*t*t*p[3][0],

    y:mt*mt*mt*p[0][1]+
      3*mt*mt*t*p[1][1]+
      3*mt*t*t*p[2][1]+
      t*t*t*p[3][1]
  };
}

/* ---------- MERMAID ---------- */

function createMermaid(){
  particles=[];

  const s=Math.min(W/900,H/650);
  const ox=W/2-450*s;
  const oy=H/2-320*s;

  function P(x,y){
    return [ox+x*s,oy+y*s];
  }

  function polygon(points,count){
    addPolygon(points.map(p=>P(p[0],p[1])),count);
  }

  function ellipse(x,y,rx,ry,count){
    addEllipse(
      ox+x*s,oy+y*s,
      rx*s,ry*s,count
    );
  }

  function curve(points,count,type){
    addCurve(
      points.map(p=>P(p[0],p[1])),
      count,type
    );
  }

  // Head
  ellipse(485,165,34,39,100);

  // Neck
  polygon([
    [469,195],[500,195],
    [505,225],[467,225]
  ],45);

  // Upper body
  polygon([
    [465,214],[502,214],
    [522,265],[516,310],
    [502,360],[467,360],
    [452,316],[450,265]
  ],170);

  // Chest and shoulder curves
  curve([
    [453,230],[425,245],
    [465,270],[485,265]
  ],45,"body");

  // Arm
  curve([
    [458,235],[425,255],
    [398,290],[374,278]
  ],65,"body");

  curve([
    [374,278],[365,273],
    [360,267],[355,260]
  ],25,"body");

  // Waist
  polygon([
    [467,345],[505,345],
    [498,390],[472,390]
  ],55);

  // Mermaid tail
  polygon([
    [475,380],[500,380],
    [520,420],[505,455],
    [470,480],[435,505],
    [420,545],[442,565],
    [465,580],[430,592],
    [385,570],[365,535],
    [385,495],[425,460],
    [448,420]
  ],300);

  // Tail fin upper lobe
  polygon([
    [385,535],[420,550],
    [440,580],[450,625],
    [410,605],[375,580],
    [345,570]
  ],130);

  // Tail fin lower lobe
  polygon([
    [385,535],[360,550],
    [325,585],[295,630],
    [350,610],[390,580],
    [420,555]
  ],130);

  // Long flowing hair
  curve([
    [466,140],[405,120],
    [400,205],[365,245]
  ],90,"hair");

  curve([
    [470,145],[420,160],
    [430,240],[390,285]
  ],90,"hair");

  curve([
    [490,140],[555,125],
    [560,205],[610,230]
  ],90,"hair");

  curve([
    [500,150],[580,155],
    [590,220],[630,270]
  ],90,"hair");

  curve([
    [490,165],[550,200],
    [540,270],[575,310]
  ],70,"hair");

  // Extra delicate hair strands
  for(let i=0;i<13;i++){
    const start=470+i*3;

    curve([
      [start,140],
      [start-65,170+i*5],
      [start-25,240+i*5],
      [start-95,300+i*4]
    ],22,"hair");
  }

  // Scales on the tail
  for(let row=0;row<12;row++){
    for(let col=0;col<7;col++){
      const x=410+col*12+Math.random()*3;
      const y=420+row*11;

      addTarget(ox+x*s,oy+y*s,"scale");
    }
  }

  // Tiny particles around the silhouette
  for(let i=0;i<150;i++){
    const x=ox+(300+Math.random()*350)*s;
    const y=oy+(100+Math.random()*500)*s;
    addTarget(x,y,"spark");
  }
}

/* ---------- BACKGROUND ---------- */

function drawBackground(){
  const gradient=ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#020816");
  gradient.addColorStop(.55,"#06243a");
  gradient.addColorStop(1,"#03101e");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  // Moon
  const mx=W*.79;
  const my=H*.22;
  const mr=Math.min(W,H)*.075;

  const glow=ctx.createRadialGradient(
    mx,my,2,mx,my,mr*2.5
  );

  glow.addColorStop(0,"rgba(195,235,255,.35)");
  glow.addColorStop(1,"rgba(100,180,255,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(mx-mr*3,my-mr*3,mr*6,mr*6);

  ctx.beginPath();
  ctx.arc(mx,my,mr,0,Math.PI*2);
  ctx.fillStyle="#d8edff";
  ctx.shadowBlur=35;
  ctx.shadowColor="#8bd7ff";
  ctx.fill();
  ctx.shadowBlur=0;

  // Stars
  for(const star of stars){
    const a=.35+Math.sin(time*.8+star.phase)*.45;

    ctx.globalAlpha=a;
    ctx.fillStyle="#e2f5ff";

    ctx.beginPath();
    ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* ---------- OCEAN ---------- */

function drawOcean(){
  for(let layer=0;layer<4;layer++){
    ctx.beginPath();

    const base=H*(.79+layer*.055);

    for(let x=0;x<=W;x+=8){
      const y=base+
        Math.sin(x*.012+time+layer)*5+
        Math.sin(x*.025-time*.7)*3;

      if(x===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.strokeStyle=`rgba(65,180,220,${.16-layer*.025})`;
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
}

/* ---------- PARTICLES ---------- */

function drawParticles(){
  for(const p of particles){
    const wave=Math.sin(time*1.5+p.phase)*2.2;
    const drift=Math.cos(time+p.phase)*1.2;

    p.x+=(p.tx+drift-p.x)*p.speed;
    p.y+=(p.ty+wave-p.y)*p.speed;

    const shimmer=.5+
      Math.sin(time*2+p.phase)*.35;

    let color="#9bdfff";

    if(p.type==="hair")color="#c5a9ff";
    if(p.type==="body")color="#b5eaff";
    if(p.type==="scale")color="#62e8e4";
    if(p.type==="spark")color="#ffffff";

    ctx.globalAlpha=.55+shimmer*.4;
    ctx.fillStyle=color;

    ctx.shadowBlur=p.type==="spark"?12:5;
    ctx.shadowColor=color;

    ctx.beginPath();
    ctx.arc(
      p.x,p.y,
      p.size*(p.type==="spark"?1.5:1),
      0,Math.PI*2
    );
    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* ---------- ANIMATION ---------- */

function animate(){
  time+=.012;

  drawBackground();
  drawOcean();
  drawParticles();

  requestAnimationFrame(animate);
}

window.addEventListener("resize",resize);

document.getElementById("music").addEventListener("change",e=>{
  if(audio){
    audio.pause();
    audio=null;
  }

  const file=e.target.files[0];

  if(file){
    audio=new Audio(URL.createObjectURL(file));
    audio.loop=true;
    audio.volume=.65;
    audio.play();
  }
});

resize();
animate();

</script>
</body>
</html>
