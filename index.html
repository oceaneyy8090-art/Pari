
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchanted Fairy Forest 🧚</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #020803;
  overflow: hidden;
  font-family: sans-serif;
}

.scene {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #071008;
}

#fairy {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  animation: float 9s ease-in-out infinite alternate;
}

#magic {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.light {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 50% 65%,
      rgba(255,245,190,.24),
      transparent 45%
    ),
    radial-gradient(
      ellipse at 80% 70%,
      rgba(170,255,170,.12),
      transparent 40%
    );
  animation: glow 5s ease-in-out infinite;
}

.controls {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 10;
}

button, label {
  background: #14291c;
  color: #fff3d1;
  border: 1px solid #b9c99c;
  border-radius: 25px;
  padding: 11px 17px;
  font-size: 13px;
  cursor: pointer;
}

input {
  display: none;
}

@keyframes float {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.055) translateY(-5px);
  }
}

@keyframes glow {
  0%,100% { opacity: .5; }
  50% { opacity: 1; }
}
</style>
</head>

<body>

<div class="scene">

  <img id="fairy" alt="Enchanted Fairy">

  <div class="light"></div>

  <canvas id="magic"></canvas>

</div>

<div class="controls">

  <label for="photo">انتخاب عکس پری</label>
  <input type="file" id="photo" accept="image/*">

  <button id="toggle">توقف جادو ✨</button>

</div>

<script>

const fairy = document.getElementById("fairy");
const picker = document.getElementById("photo");
const canvas = document.getElementById("magic");
const ctx = canvas.getContext("2d");

let running = true;
let animation;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);

  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();
window.addEventListener("resize", resize);

// انتخاب همان عکس مرجع
picker.addEventListener("change", e => {
  const file = e.target.files[0];

  if (file) {
    fairy.src = URL.createObjectURL(file);
  }
});

// ذرات جادویی
const colors = [
  "#fff6ce",
  "#e5ffd9",
  "#fff0e9",
  "#d9ffff",
  "#e7dcff"
];

const particles = [];

for (let i = 0; i < 120; i++) {
  particles.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    size: .5 + Math.random() * 2.5,
    speed: .2 + Math.random() * .8,
    color: colors[
      Math.floor(Math.random() * colors.length)
    ],
    phase: Math.random() * 6.28
  });
}

function animate() {

  if (!running) return;

  ctx.clearRect(
    0, 0,
    innerWidth,
    innerHeight
  );

  particles.forEach(p => {

    p.y -= p.speed * .35;
    p.x += Math.sin(p.phase) * .25;
    p.phase += .025;

    if (p.y < 0) {
      p.y = innerHeight;
      p.x = Math.random() * innerWidth;
    }

    const opacity =
      .3 + .7 * Math.abs(Math.sin(p.phase));

    ctx.globalAlpha = opacity;

    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

    // درخشش ستاره‌ای
    if (p.size > 2) {
      ctx.fillRect(
        p.x - 5,
        p.y,
        10,
        .7
      );

      ctx.fillRect(
        p.x,
        p.y - 5,
        .7,
        10
      );
    }

  });

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  animation = requestAnimationFrame(animate);
}

animate();

// توقف و شروع مجدد
document.getElementById("toggle").onclick = () => {

  running = !running;

  document.getElementById("toggle").textContent =
    running ? "توقف جادو ✨" : "ادامه جادو ✨";

  if (running) animate();
  else cancelAnimationFrame(animation);

};

</script>

</body>
</html>
